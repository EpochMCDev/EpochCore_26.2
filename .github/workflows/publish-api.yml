name: Publish API

on:
  push:
    branches: [ "ver/26.2" ]

jobs:
  build:
    # Run workflow only on main repo
    if: ${{ github.repository == 'EpochMCDev/Epoch-Core' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Build
        run: ./gradlew build -x test

      # Epoch-Core 尚未配置 Maven 发布仓库。
      # 如需发布 leaf-api 到自己的 Maven（如 GitHub Packages 或自建 Nexus），
      # 在此添加发布步骤，并配置 REPO_USER / REPO_PASSWORD secrets。
